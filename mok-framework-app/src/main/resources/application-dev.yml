# ================================================================
#  mok-framework 框架配置
# ================================================================
mok:
  #  mok-framework ai配置
  ai:
    provider: deepseek                             # AI 服务提供方（deepseek / openai）
    api-key: ${mok.ai.api-key}                     # AI 服务 API 密钥
    model: deepseek-v4-flash                       # 使用的模型名称
    system-prompt: "你是一个专业的系统日志分析助手，请根据用户提供的日志信息，分析错误原因并给出可行的解决方案。回答请使用Markdown格式，结构清晰。"  # AI 系统提示词
  #  MOK 限流 Starter 配置
  rate-limiter:
    enabled: true
    backend: redis                         # 脚手架固定使用 Redis 分布式限流
    failure-policy: allow                  # Redis 异常时优先保证主业务可用
    rate-key-prefix: "rate:limit:"
    duplicate-key-prefix: "duplicate:submit:"
    default-window: 60
    default-limit: 10
    default-duplicate-lock-time: 3
    default-rate-limit-message: "请求过于频繁，请稍后再试"
    default-duplicate-message: "请勿重复提交"
    trust-forwarded-headers: false
    monitor-enabled: true
  #  mok-framework 系统启动相关配置
  start:
    systemStartCheckMail: false
  #  mok-framework 操作日志配置
  operation-log:
    enabled: true
    save-location: es
    async-strategy: rabbitmq
    record-get: true
    max-content-length: 2000
  #  mok-framework 验证码配置
  captcha:
    width: 120
    height: 40
    length: 4        # 当 type = math 时，此参数无效
    expire: 300
    type: math       # math / char

# ================================================================
#  文件存储配置
# ================================================================
file:
  storage:
    base-path: ${user.home}/mok-uploads
    url-prefix: /api/uploads
    base-url: http://localhost:8080
    allowed-types:
      - image/jpeg
      - image/png
      - image/gif
      - application/pdf
      - application/msword
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
