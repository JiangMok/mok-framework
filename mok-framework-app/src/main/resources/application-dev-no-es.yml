# ============================================
# 开发环境配置 - 用于本地开发和调试
# ============================================

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchDataAutoConfiguration
      - org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchClientAutoConfiguration
      - org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchRestClientAutoConfiguration
      - org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchRepositoriesAutoConfiguration
  config:
    import: optional:file:./env/dev-env.properties
  # 数据源配置 - 开发环境数据库
  datasource:
    dynamic:
      primary: master  # 设置默认的数据源或者数据源组,默认值即为master
      strict: false  # 严格匹配数据源,默认false. true未匹配到指定数据源时抛异常,false使用默认数据源
      datasource:
        master:
          url: jdbc:mysql://localhost:3306/mf_master_dev?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
          username: root
          password: ${spring.datasource.dynamic.datasource.master.password}
          driver-class-name: com.mysql.cj.jdbc.Driver
          hikari:
            max-lifetime: 300000
            maximum-pool-size: 20
            minimum-idle: 5
            connection-timeout: 30000
        # 操作日志数据源 - 用于存储操作日志
        operationLog:
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://localhost:3306/mf_operation_log_dev?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
          username: root
          password: ${spring.datasource.dynamic.datasource.operationLog.password}
          hikari:
            max-lifetime: 300000
            maximum-pool-size: 10
            minimum-idle: 2
            connection-timeout: 30000
  # Redis配置 - 开发环境缓存
  data:
    redis:
      host: localhost # Redis服务器地址2
      port: 6379            # Redis端口号
      password: ${spring.data.redis.password}      # Redis访问密码
      database: 3           # Redis数据库索引（0-15）
      timeout: 3000ms       # 连接超时时间
      lettuce:
        pool:
          max-active: 20    # 连接池最大连接数
          max-wait: -1ms    # 最大等待时间（-1表示无限等待）
          max-idle: 8       # 最大空闲连接数
          min-idle: 0       # 最小空闲连接数
  rabbitmq:
    # 基础连接配置
    host: localhost            # RabbitMQ服务器地址（开发环境使用本地）
    port: 5672                 # RabbitMQ端口（默认5672）
    username: admin            # 用户名（默认guest）
    password: ${spring.rabbitmq.password}            # 密码（默认guest）
    virtual-host: /            # 虚拟主机（默认/）

    # 连接池配置
    connection-timeout: 30000  # 连接超时时间（30秒）
    cache:
      channel:
        size: 50               # 通道缓存大小
        checkout-timeout: 20000 # 获取通道超时时间
    #      connection:
    #        mode: CHANNEL          # 连接缓存模式
    #        size: 10               # 连接池大小

    # 生产者配置（消息发送方）
    publisher-confirm-type: correlated  # 消息发送确认机制
    publisher-returns: true             # 启用消息返回机制

    # 消息模板配置
    template:
      mandatory: true          # 当消息无法路由时返回给生产者
      retry:
        enabled: true          # 启用重试
        max-attempts: 3        # 最大重试次数
        initial-interval: 1000 # 初始重试间隔（毫秒）

    # 消费者配置（消息接收方）
    listener:
      simple:
        acknowledge-mode: manual       # 手动确认消息（更可靠）
        concurrency: 2                 # 最小消费者数量
        max-concurrency: 3            # 最大消费者数量
        prefetch: 5                   # 每次预取的消息数量
        default-requeue-rejected: false     # 拒绝时不重新入队
        retry:
          enabled: true                # 启用消费重试
          max-attempts: 3              # 最大重试次数
          initial-interval: 3000       # 初始重试间隔（毫秒）
          max-interval: 10000          # 最大重试间隔（毫秒）
          multiplier: 2.0              # 重试间隔乘数
  elasticsearch:
    repositories:
      enabled: false
#      uris: http://192.168.5.22:9200
#      username: elastic
#      password: 123456

  # springAI 整合
  ai:
    openai:
      api-key: ${spring.ai.openai.api-key}   # 你的Key
      base-url: https://api.deepseek.com/ # 如果用的是DeepSeek或代理地址
      chat:
        options:
          model: deepseek-v4-flash
          temperature: 0.7

############## Sa-Token 配置 (文档: https://sa-token.cc) ##############
sa-token:
  # token 名称（同时也是 cookie 名称）
  token-name: Authorization
  # token 前缀
  token-prefix: Bearer
  # token 有效期（单位：秒） 默认30天，-1 代表永久有效(600秒 >> 10分钟)
  timeout: 1800
  # 从 Cookie 读取 Token
  is-read-cookie: false
  # token 最低活跃频率（单位：秒），如果 token 超过此时间没有访问系统就会被冻结，默认-1 代表不限制，永不冻结
  active-timeout: -1
  # 是否允许同一账号多地同时登录 （为 true 时允许一起登录, 为 false 时新登录挤掉旧登录）
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个 token （为 true 时所有登录共用一个 token, 为 false 时每次登录新建一个 token）
  is-share: false
  # token 风格（默认可取值：uuid、simple-uuid、random-32、random-64、random-128、tik）
  token-style: jwt
  # 是否输出操作日志
  is-log: true
  # jwt秘钥
  jwt-secret-key: ${sa-token.jwt-secret-key}
  token-session-check-login: true


# MyBatis Plus开发配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true  # 开启驼峰命名自动转换
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl     # 使用 Slf4j 实现 (生产环境使用)
  global-config:
    db-config:
      logic-delete-field: isDeleted  # 逻辑删除字段名
      logic-delete-value: 1          # 逻辑删除值
      logic-not-delete-value: 0      # 逻辑未删除值
  mapper-locations: classpath*:/mapper/*.xml  # Mapper XML文件位置
  type-aliases-package: com.mok.framework.*.entity  # 实体类包路径

