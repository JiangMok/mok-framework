# ================================================================
#  [1] Spring 框架核心与应用元数据
# ================================================================
spring:
  application:
    name: mok-framework
    version: 1.0.0

  # ------------------------------------
  #  激活的环境 Profile（dev-no-es / prod）
  # ------------------------------------
  profiles:
    active: dev

  # ------------------------------------
  #  外部配置文件导入顺序
  # ------------------------------------
  config:
    import:
      - optional:classpath:application-${spring.profiles.active}.yml
      - optional:file:./config/
      - optional:file:/etc/mok-framework/

  # ------------------------------------
  #  文件上传大小限制
  # ------------------------------------
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB

# ================================================================
#  [2] 内嵌 Tomcat 服务器配置
# ================================================================
server:
  port: 8080
  servlet:
    context-path: /api
  tomcat:
    uri-encoding: UTF-8
    max-threads: 200
    min-spare-threads: 10

# ================================================================
#  [3] 全局日志格式（与环境无关）
# ================================================================
logging:
  level:
    com.mok.framework: debug
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %-5level [%thread] %logger{36} - %msg%n"

# ================================================================
#  [4] 业务安全与文件存储通用配置
# ================================================================
system:
  sensitive-fields:   # 全局敏感字段，用于日志脱敏
    - password
    - pwd
    - confirmPassword
    - oldPassword
    - newPassword
    - token
    - secret
    - apiKey

file:
  storage:
    base-path: ${user.home}/mok-uploads
    url-prefix: /data/uploads
    base-url: http://localhost:8080
    allowed-types:
      - image/jpeg
      - image/png
      - image/gif
      - application/pdf
      - application/msword
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document

# ================================================================
#  [5] 系统动态配置（策略接口实现选择）
# ================================================================
# 验证码实现策略：接口 com.mok.framework.captcha.service.CaptchaService
captchaImpl:
  generate:
    type: mok-framework   # 可选: mok-framework / hutool

# 操作日志存储策略：接口 com.mok.framework.operationLog.service.OperationLogService
operationlogImpl:
  save-location:
    type: es    # 可选: mysql / es

# ================================================================
#  [6] 验证码业务参数（Hutool 实现时仅生效width和height）
# ================================================================
captcha:
  width: 120
  height: 40
  length: 4        # 当 type = math 时，此参数无效
  expire: 300
  type: math       # math / char