# ================================================================
#   Spring 框架核心与应用元数据
# ================================================================
spring:
  application:
    name: mok-framework
    version: ${APP_VERSION:0.0.1-SNAPSHOT}

  # ------------------------------------
  #  激活的环境 Profile（dev-no-es / prod）
  # ------------------------------------
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev-no-es}

  # ------------------------------------
  #  外部配置文件导入顺序
  # ------------------------------------
  config:
    import:
      - optional:classpath:application-${spring.profiles.active}.yml
      - optional:file:./config/
      - optional:file:/etc/mok-framework/

  # ------------------------------------
  #  文件上传大小限制
  # ------------------------------------
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB

# ================================================================
#  全局日志格式（与环境无关）
# ================================================================
logging:
  level:
    com.mok.framework: debug
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %-5level [%thread] %logger{36} - %msg%n"

# ================================================================
#   业务安全与文件存储通用配置
# ================================================================
system:
  sensitive-fields:   # 全局敏感字段，用于日志脱敏
    - password
    - pwd
    - confirmPassword
    - oldPassword
    - newPassword
    - token
    - refreshToken
    - secret
    - apiKey
    - encryptedCredentials
    - challengeId

# 登录私钥由运维提供本地绝对路径，使用3072位RSA、PKCS#8 PEM；不得提交真实私钥。
mok:
  security:
    login-crypto:
      key-id: ${LOGIN_RSA_KEY_ID:login-v1}
      private-key-path: ${LOGIN_RSA_PRIVATE_KEY_PATH:}
      challenge-ttl-seconds: 120
      # 轮换过渡期可在外部配置添加 previous-private-key-paths: {旧keyId: 私钥路径}

# ================================================================
#  系统动态配置（策略接口实现选择）
# ================================================================
# 验证码实现策略：接口 com.mok.framework.captcha.service.CaptchaService
captchaImpl:
  generate:
    type: mok-framework   # 可选: mok-framework / hutool


