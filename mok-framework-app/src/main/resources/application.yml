# Spring Boot应用主配置 - 控制加载哪个环境配置文件
spring:
  application:
    name: mok-framework
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB # 应用名称，用于服务发现和监控
  
  # 激活的环境配置文件，默认使用dev环境
  # 可以通过启动参数修改：--spring.profiles.active=prod
  profiles:
    active: dev
  
  # 配置文件加载顺序：后面的会覆盖前面的
  # 1. application.yml（当前文件）
  # 2. application-{profile}.yml（根据active加载）
  # 3. 外部配置文件（优先级最高）
  config:
    import:
      - optional:classpath:application-${spring.profiles.active}.yml  # 加载环境特定配置
      - optional:file:./config/  # 加载外部配置文件目录
      - optional:file:/etc/mok-framework/  # 加载系统级配置文件

# 服务器基础配置
server:
  port: 8080            # 服务器端口
  servlet:
    context-path: /api  # 应用上下文路径，所有API的根路径
  tomcat:
    uri-encoding: UTF-8  # URI编码格式
    max-threads: 200    # 最大线程数
    min-spare-threads: 10  # 最小空闲线程数

# 跨环境通用的日志配置
logging:
  level:
    com.mok.framework: debug  # 应用日志级别
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %-5level [%thread] %logger{36} - %msg%n"  # 控制台日志格式
# 应用自定义配置
system:
  sensitive-fields:  # 需要脱敏处理的字段列表
    - password
    - pwd
    - confirmPassword
    - oldPassword
    - newPassword
    - token
    - secret
    - apiKey

# 文件存储配置
file:
  storage:
    base-path: ${user.home}/mok-uploads  # 存储的物理路径
    url-prefix: /api/uploads            # 注意：这里要加上 /api 前缀
    base-url: http://localhost:8080     # 新增：基础URL
    allowed-types:
      - image/jpeg
      - image/png
      - image/gif
      - application/pdf
      - application/msword
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
############ 系统动态配置 #############################################################################
# 配置验证码生成验证的实现类 接口位置:com.mok.framework.captcha.service.CaptchaService
captchaImpl:
  generate:
    type: mok-framework

# 操作日志保存位置 接口位置:com.mok.framework.elasticsearch.service.OperationLogService
operationlogImpl:
  save-location:
    type: es
