# ================================================================
#  生产环境配置 (application-prod.yml)
#  使用前请务必替换所有占位符（${...}）为实际生产环境值
# ================================================================

spring:
  config:
    import: optional:file:/etc/mok-framework/application-prod-override.yml  # 可选的外部覆盖文件

  # ================================================================
  #  自动配置排除（若不需要 ES，保持排除）
  # ================================================================
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchDataAutoConfiguration
      - org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchClientAutoConfiguration
      - org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchRestClientAutoConfiguration
      - org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchRepositoriesAutoConfiguration

  # ================================================================
  #  生产数据库 — 动态多数据源
  # ================================================================
  datasource:
    dynamic:
      primary: master
      strict: true   # 生产环境建议严格匹配，防止误操作
      datasource:
        master:
          url: jdbc:mysql://${master.mysql.host}:${master.mysql.port}/**********?useUnicode=true&characterEncoding=utf8&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Shanghai
          username: root
          password: ${master.mysql.password}
          driver-class-name: com.mysql.cj.jdbc.Driver
          hikari:
            max-lifetime: 1800000       # 30分钟
            maximum-pool-size: 50       # 根据实际并发调整
            minimum-idle: 10
            connection-timeout: 30000
            idle-timeout: 600000
        operationLog:
          url: jdbc:mysql://${master.mysql.host}:${master.mysql.port}/**********?useUnicode=true&characterEncoding=utf8&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Shanghai
          username: root
          password: ${master.mysql.password}
          driver-class-name: com.mysql.cj.jdbc.Driver
          hikari:
            max-lifetime: 1800000
            maximum-pool-size: 20
            minimum-idle: 5
            connection-timeout: 30000
            idle-timeout: 600000

  # ================================================================
  #  生产 Redis — 哨兵/集群请调整配置
  # ================================================================
  data:
    redis:
      host: ${spring.data.redis.host}
      port: 6379
      password: ${spring.data.redis.password}
      database: 0                      # 生产环境建议使用默认库或规划好的库
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 100              # 适当增大连接池
          max-wait: -1ms
          max-idle: 20
          min-idle: 5

  # ================================================================
  #  生产 RabbitMQ
  # ================================================================
  rabbitmq:
    host: ${spring.rabbitmq.host}
    port: 5672
    username: admin
    password: ${spring.rabbitmq.password}
    virtual-host: ${PROD_RABBITMQ_VHOST:/}
    connection-timeout: 30000
    requested-heartbeat: 60           # 心跳保活
    cache:
      channel:
        size: 100
        checkout-timeout: 20000
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
      retry:
        enabled: true
        max-attempts: 3
        initial-interval: 1000
    listener:
      simple:
        acknowledge-mode: manual
        concurrency: 5                 # 生产环境适当增加消费者
        max-concurrency: 10
        prefetch: 10
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 3000
          max-interval: 10000
          multiplier: 2.0

  # ================================================================
  #  Spring AI（生产环境使用自己的 API Key）
  # ================================================================
  ai:
    openai:
      api-key: ${spring.ai.openai.api-key}
      base-url: https://api.deepseek.com/
      chat:
        options:
          model: deepseek-v4-flash
          temperature: 0.3

# ================================================================
#  Sa-Token 生产环境配置
# ================================================================
sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 7200
  is-read-cookie: false
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: jwt
  is-log: true
  jwt-secret-key: ${sa-token.jwt-secret-key}
  token-session-check-login: true

# ================================================================
#  MyBatis-Plus 生产配置（关闭 SQL 日志）
# ================================================================
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl   # 生产环境不输出 SQL 日志
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/*.xml
  type-aliases-package: com.mok.framework.*.entity

# ================================================================
#  API 文档 — 生产环境建议关闭
# ================================================================
springdoc:
  api-docs:
    enabled: false                   # 关闭 OpenAPI 端点
  swagger-ui:
    enabled: false                   # 关闭 Swagger UI

# ================================================================
#  日志策略 — 生产环境减少日志量
# ================================================================
logging:
  level:
    com.mok.framework: WARN          # 仅记录警告和错误
    org.springframework.security: WARN
    org.springframework.web: WARN
    root: WARN
  file:
    name: /var/log/mok-framework/application.log   # 生产日志路径
    max-size: 100MB
    max-history: 90                 # 保留3个月

# ================================================================
#  操作日志配置
# ================================================================


# ================================================================
#  mok-framework 框架配置
# ================================================================
mok:
  #  mok-framework ai配置
  ai:
    provider: ${PROD_AI_PROVIDER:deepseek}
    api-key: ${PROD_AI_API_KEY}     # 与 spring.ai.openai.api-key 保持一致或独立
    model: ${PROD_AI_MODEL:deepseek-v4-flash}
  #  MOK 限流 Starter 配置
  rate-limiter:
    enabled: true
    backend: redis
    failure-policy: allow
    rate-key-prefix: "rate:limit:"
    duplicate-key-prefix: "duplicate:submit:"
    default-window: 60
    default-limit: 10
    default-duplicate-lock-time: 10
    default-rate-limit-message: "请求过于频繁，请稍后再试"
    default-duplicate-message: "请勿重复提交"
    trust-forwarded-headers: false         # 仅在可信反向代理后部署时改为 true
    monitor-enabled: true
  #  mok-framework 系统启动相关配置
  start:
    systemStartCheckMail: true
  #  mok-framework 操作日志配置
  operation-log:
    enabled: true
    save-location: es
    async-strategy: rabbitmq
    record-get: false                 # 生产环境通常不记录 GET 请求，减少日志量
    max-content-length: 500           # 限制内容长度，节省存储
  #  mok-framework 验证码配置
  captcha:
    width: 120
    height: 40
    length: 4        # 当 type = math 时，此参数无效
    expire: 300
    type: math       # math / char

# ================================================================
#  服务器端口建议通过环境变量 SERVER_PORT 覆盖，此处默认
# ================================================================
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
  tomcat:
    uri-encoding: UTF-8
    max-threads: 500                # 生产环境提升线程数
    min-spare-threads: 50

# ================================================================
#  文件存储配置
# ================================================================
file:
  storage:
    base-path: /data/uploads  # Docker容器内路径
    url-prefix: /api/uploads
    base-url: ${FILE_BASE_URL}  # ← 修改：替换为服务器IP和端口
    allowed-types:
      - image/jpeg
      - image/png
      - image/gif
      - image/webp
      - image/svg+xml
      - application/pdf
      - application/msword
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
      - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      - application/vnd.openxmlformats-officedocument.presentationml.presentation
      - text/plain
      - application/zip
      - application/x-rar-compressed

# ================================================================
# 操作日志的保存位置
# ================================================================
operationlogImpl:
  save-location:
    type: mysql    # 可选: mysql / es